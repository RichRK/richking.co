title: Three Peaks
description: "Comprising of Snowdon, Ben Nevis and Scafell Pike, the Three Peaks make up the three
  tallest mountains in the UK. Our challenge: scaling them all in 6 days, relying only on hostels
  and public transport. Rock, tundra and sheep dominate."
